
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zifi's Hydration Stamp Card</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <header>
            <h1>Zifi's Hydration Stamp Card</h1>

            <p>
                Drink water every day and collect your stamps! 
            </p>
        </header>

        <section class="stamp-card">

            <h2>Your 30-Day Challenge</h2>
            
            <p id="progress">
                0 / 30 days completed
            </p>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>


            <div id="stamp-grid" class="stamp-grid">
                <!-- Our 30 stamps will appear here -->
            </div>

        </section>

        <button id="reset-button" type="button">
            Reset All Stamps
        </button>

    </main>

</body>
</html>
