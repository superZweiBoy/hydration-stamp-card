
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zifi's Hydration Stamp Card</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <header>
            <h1>Zifi's Hydration Stamp Card</h1>

            <p>
                Drink water every day at 4pm (or any timing) and collect your stamps! Complete all 30 days for a special reward! 
            </p>
        </header>

        <section class="stamp-card">

            <h2>Your 30-Day Challenge!</h2>
            
            <p id="progress">
                0 / 30 days completed
            </p>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>


            <div id="stamp-grid" class="stamp-grid">
                <!-- Our 30 stamps will appear here -->
            </div>

        </section>

        <button id="reset-button" type="button">
            Reset All Stamps
        </button>

        <!-- Decorative ocean wave -->
        <div class="card-wave">
            <svg viewBox="0 0 600 100"
                preserveAspectRatio="none"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    d="M0 35 C100 5, 180 65, 300 35 S500 10, 600 40 L600 100 L0 100 Z"
                    fill="#BCEBFA"
                />

                <path
                    d="M0 55 C120 25, 200 80, 330 50 S500 30, 600 55 L600 100 L0 100 Z"
                    fill="#55C5ED"
                />

            </svg>
        </div>

    </main>

</body>
</html>
